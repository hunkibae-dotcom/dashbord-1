<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>포장강화 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'Noto Sans KR', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        /* ── CSS 변수: 라이트/다크 테마 ── */
        :root {
            --bg:        #F8FAFC;
            --panel:     #FFFFFF;
            --border:    #E2E8F0;
            --text:      #1E293B;
            --text-sub:  #64748B;
            --label:     #94A3B8;
            --shadow:    0 2px 12px rgba(0,0,0,.08);
            --divider:   #E2E8F0;
            --input-bg:  #F1F5F9;
            --nav-bg:    rgba(255,255,255,.96);
            --icon-bg:   #F1F5F9;
            --log-border:#F1F5F9;
        }
        html.dark {
            --bg:        #0B0F19;
            --panel:     #111827;
            --border:    #1E293B;
            --text:      #F1F5F9;
            --text-sub:  #64748B;
            --label:     #475569;
            --shadow:    0 4px 24px rgba(0,0,0,.4);
            --divider:   #1E293B;
            --input-bg:  #0B0F19;
            --nav-bg:    rgba(17,24,39,.97);
            --icon-bg:   #1E293B;
            --log-border:#1E293B;
        }

        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); transition: background .25s, color .25s; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
            transition: background .25s, border-color .25s;
        }
        .label {
            font-size: 10px; font-weight: 700; letter-spacing: .1em;
            text-transform: uppercase; color: var(--label);
        }
        .kpi-num  { font-size: 48px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
        .kpi-unit { font-size: 15px; font-weight: 600; color: var(--text-sub); }
        .divider  { height: 1px; background: var(--divider); margin: 10px 0; }

        header { background: var(--panel); border-bottom: 1px solid var(--border); transition: background .25s, border-color .25s; }
        nav    { background: var(--nav-bg); border-top: 1px solid var(--border); transition: background .25s, border-color .25s; }

        /* 토글 스위치 — F.WORK 스타일 (테두리형) */
        .theme-toggle { position: relative; width: 44px; height: 24px; display: inline-block; }
        .theme-toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
        .toggle-slider {
            position: absolute; inset: 0; border-radius: 999px; cursor: pointer;
            background: transparent;
            border: 2px solid var(--text);
            transition: border-color .25s;
        }
        .toggle-slider::before {
            content: ''; position: absolute;
            width: 16px; height: 16px; border-radius: 50%;
            left: 2px; top: 2px;
            background: var(--text);
            border: 2px solid var(--text);
            transition: transform .25s, background .25s, border-color .25s;
        }
        html.dark .toggle-slider::before { transform: translateX(20px); }

        /* 아이콘 투명 배경 */
        .card-icon {
            position: absolute; right: 12px; top: 12px;
            font-size: 40px; opacity: .07; pointer-events: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin .8s linear infinite; }

        /* 버튼 탭 피드백 */
        button:active { opacity: .7; transform: scale(.97); }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col" style="padding-bottom:80px">

    <!-- ── 헤더 ─────────────────────────────────────────── -->
    <header style="padding:12px 16px;position:sticky;top:0;z-index:40;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;">
        <!-- 뒤로가기 -->
        <div>
            <button onclick="history.back()"
                style="width:36px;height:36px;border-radius:10px;border:none;background:transparent;color:var(--text-sub);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
        </div>
        <!-- 로고 + 타이틀 -->
        <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#00E676,#00B0FF);display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:17px;flex-shrink:0;box-shadow:0 0 14px rgba(0,176,255,.2);">
                <i class="fa-solid fa-box"></i>
            </div>
            <span style="font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;">포장강화 대시보드</span>
        </div>
        <!-- 라이트/다크 토글 -->
        <div style="display:flex;justify-content:flex-end;align-items:center;">
            <label class="theme-toggle">
                <input type="checkbox" id="themeCheck" onchange="toggleTheme()">
                <span class="toggle-slider"></span>
            </label>
        </div>
    </header>

    <!-- ── 메인 ─────────────────────────────────────────── -->
    <main style="flex:1;padding:16px;max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;">

        <!-- 상태 바 -->
        <div id="statusBar" style="display:flex;align-items:center;gap:8px;font-size:11px;font-family:monospace;">
            <i id="statusIcon" class="fa-solid fa-circle-notch spin" style="color:#00B0FF;font-size:10px;"></i>
            <span id="statusText" style="color:var(--text-sub);">데이터 로딩 중...</span>
            <button onclick="loadData()" style="margin-left:auto;background:none;border:none;cursor:pointer;color:var(--text-sub);font-size:13px;padding:4px;">
                <i id="syncIcon" class="fa-solid fa-arrows-rotate"></i>
            </button>
        </div>

        <!-- Row 1: KPI 2열 -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">

            <!-- 포장 대기 -->
            <div class="card" style="position:relative;overflow:hidden;">
                <span class="card-icon" style="color:#FF9100;"><i class="fa-solid fa-boxes-stacked"></i></span>
                <div class="label">포장 대기</div>
                <div style="margin-top:12px;">
                    <div style="display:flex;align-items:baseline;gap:6px;">
                        <span id="kpiPendingQty" class="kpi-num" style="color:#FF9100;">—</span>
                        <span class="kpi-unit">BOX</span>
                    </div>
                    <div style="margin-top:4px;font-size:11px;color:var(--text-sub);">
                        <span id="kpiPendingItems">—</span>건
                    </div>
                </div>
                <div class="divider"></div>
                <div id="kpiTodayDate" style="font-size:10px;color:var(--label);font-family:monospace;">—</div>
            </div>

            <!-- 금일 작업 인원 -->
            <div class="card" style="position:relative;overflow:hidden;">
                <span class="card-icon" style="color:#00B0FF;"><i class="fa-solid fa-users"></i></span>
                <div class="label">금일 작업</div>
                <div style="margin-top:12px;">
                    <div style="display:flex;align-items:baseline;gap:6px;">
                        <span id="kpiWorkers" class="kpi-num" style="color:#00B0FF;">—</span>
                        <span class="kpi-unit">명</span>
                    </div>
                    <div style="margin-top:4px;font-size:11px;color:var(--text-sub);">작업 인원</div>
                </div>
                <div class="divider"></div>
                <button onclick="openWorkerInput()" style="font-size:11px;font-weight:700;color:#00B0FF;background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:5px;">
                    <i class="fa-solid fa-plus" style="font-size:9px;"></i> 인원 등록
                </button>
            </div>
        </div>

        <!-- Row 2: 수출 일정 -->
        <div class="card" style="position:relative;overflow:hidden;">
            <span class="card-icon" style="color:#00E676;font-size:48px;"><i class="fa-solid fa-ship"></i></span>
            <div class="label">수출 일정</div>
            <div style="margin-top:12px;display:flex;align-items:flex-end;justify-content:space-between;">
                <div>
                    <span id="nearestDDay" style="font-size:36px;font-weight:800;line-height:1;letter-spacing:-.02em;color:#00E676;">—</span>
                    <div id="nearestRound" style="margin-top:8px;font-size:15px;font-weight:700;color:var(--text);">—</div>
                </div>
                <div style="text-align:right;">
                    <div id="nearestLoadDate" style="font-size:11px;font-family:monospace;color:var(--text-sub);">—</div>
                    <div style="font-size:11px;color:var(--label);margin-top:3px;">수량 <span id="nearestQtyVal" style="font-weight:700;font-family:monospace;">—</span> BOX</div>
                </div>
            </div>
        </div>

        <!-- Row 3: 이전 작업 내용 Log -->
        <div class="card" style="display:flex;flex-direction:column;gap:12px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
                <div class="label">이전 작업 내용 Log</div>
                <span style="font-size:9px;background:var(--icon-bg);color:var(--text-sub);padding:2px 7px;border-radius:5px;font-weight:700;border:1px solid var(--border);">최근 완료</span>
            </div>
            <div id="workLogList" class="no-scrollbar" style="max-height:190px;overflow-y:auto;display:flex;flex-direction:column;">
                <div style="font-size:12px;color:var(--text-sub);text-align:center;padding:16px 0;">로딩 중...</div>
            </div>
        </div>

        <!-- Row 4: 포장 강화 현황 차트 -->
        <div class="card" style="display:flex;flex-direction:column;gap:12px;" id="chartSection">
            <div style="font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px;">
                <i class="fa-solid fa-chart-column" style="color:#00B0FF;"></i> 포장 강화 현황
            </div>
            <div style="position:relative;height:200px;">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

    </main>

    <!-- ── 제품검색 서브메뉴 (네비 위에 팝업) ────────────── -->
    <div id="searchSubMenu" style="position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(12px);z-index:45;display:none;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:320px;opacity:0;transition:opacity .2s,transform .2s;">
        <button onclick="closeSearchSub();openModal('searchModal')"
            style="background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;color:var(--text);cursor:pointer;box-shadow:var(--shadow);width:100%;">
            <i class="fa-solid fa-magnifying-glass" style="color:#00B0FF;font-size:16px;width:20px;"></i>
            수출 / 제품 상세검색
        </button>
        <button onclick="closeSearchSub();openModal('specModal')"
            style="background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;color:var(--text);cursor:pointer;box-shadow:var(--shadow);width:100%;">
            <i class="fa-solid fa-ruler-combined" style="color:#00E676;font-size:16px;width:20px;"></i>
            제품 상세 스펙 조회
        </button>
    </div>
    <!-- 서브메뉴 백드롭 -->
    <div id="searchSubBd" onclick="closeSearchSub()" style="position:fixed;inset:0;z-index:44;display:none;"></div>

    <!-- ── 하단 네비게이션 ────────────────────────────────── -->
    <nav style="position:fixed;bottom:0;left:0;right:0;padding:8px 0 14px;display:flex;justify-content:space-around;align-items:center;z-index:46;backdrop-filter:blur(12px);">
        <button id="navHome" onclick="navSelect('navHome');scrollTo({top:0,behavior:'smooth'})"
            style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#00B0FF;background:none;border:none;cursor:pointer;">
            <i class="fa-solid fa-house" style="font-size:18px;"></i>
            <span style="font-size:10px;font-weight:700;">홈</span>
        </button>
        <button id="navChart" onclick="navSelect('navChart');document.getElementById('chartSection').scrollIntoView({behavior:'smooth'})"
            style="display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-sub);background:none;border:none;cursor:pointer;">
            <i class="fa-solid fa-chart-simple" style="font-size:18px;"></i>
            <span style="font-size:10px;">차트</span>
        </button>
        <button id="navSearch" onclick="toggleSearchSub()"
            style="display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-sub);background:none;border:none;cursor:pointer;">
            <i class="fa-solid fa-magnifying-glass" style="font-size:18px;"></i>
            <span style="font-size:10px;">제품검색</span>
        </button>
        <button id="navSettings" onclick="navSelect('navSettings');openModal('settingsModal')"
            style="display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-sub);background:none;border:none;cursor:pointer;">
            <i class="fa-solid fa-gear" style="font-size:18px;"></i>
            <span style="font-size:10px;">설정</span>
        </button>
    </nav>

    <!-- ── 작업 인원 모달 ────────────────────────────────── -->
    <div id="workerModal" style="position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);">
        <div style="background:var(--panel);border:1px solid var(--border);border-radius:24px 24px 0 0;padding:24px;width:100%;max-width:520px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
                <span style="font-size:16px;font-weight:800;color:var(--text);">금일 작업 인원 등록</span>
                <button onclick="closeWorkerInput()" style="width:36px;height:36px;border-radius:10px;border:none;background:var(--icon-bg);color:var(--text-sub);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <input id="workerInput" type="number" inputmode="numeric" placeholder="인원 수 입력"
                   style="width:100%;background:var(--input-bg);color:var(--text);padding:14px 16px;border-radius:12px;border:1px solid var(--border);font-size:20px;font-weight:700;outline:none;margin-bottom:12px;transition:border-color .2s;"
                   onfocus="this.style.borderColor='#00B0FF'" onblur="this.style.borderColor='var(--border)'">
            <button onclick="saveWorkers()" style="width:100%;background:#00B0FF;color:#0B0F19;padding:15px;border-radius:12px;border:none;font-size:15px;font-weight:800;cursor:pointer;">
                저장
            </button>
        </div>
    </div>

    <!-- ── 수출/제품 상세검색 모달 ──────────────────────── -->
    <div id="searchModal" style="position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);">
        <div style="background:var(--panel);border:1px solid var(--border);border-radius:24px 24px 0 0;padding:20px;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
                <span style="font-size:16px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px;">
                    <i class="fa-solid fa-magnifying-glass" style="color:#00B0FF;"></i> 수출 / 제품 상세검색
                </span>
                <button onclick="closeModal('searchModal')" style="width:34px;height:34px;border-radius:10px;border:none;background:var(--icon-bg);color:var(--text-sub);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <!-- 검색 입력 -->
            <div style="display:flex;flex-direction:column;gap:10px;">
                <input id="sf_round" type="text" placeholder="건명 / 차수 (예: FAM-110)"
                    style="background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14px;outline:none;width:100%;"
                    oninput="runSearch()" onfocus="this.style.borderColor='#00B0FF'" onblur="this.style.borderColor='var(--border)'">
                <input id="sf_code" type="text" placeholder="제품코드 (예: CAC2083SN)"
                    style="background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14px;outline:none;width:100%;"
                    oninput="runSearch()" onfocus="this.style.borderColor='#00B0FF'" onblur="this.style.borderColor='var(--border)'">
                <input id="sf_country" type="text" placeholder="국가 / 구분 (예: FAM, NY)"
                    style="background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14px;outline:none;width:100%;"
                    oninput="runSearch()" onfocus="this.style.borderColor='#00B0FF'" onblur="this.style.borderColor='var(--border)'">
            </div>
            <!-- 결과 수 -->
            <div style="font-size:12px;color:var(--text-sub);display:flex;justify-content:space-between;align-items:center;">
                <span>검색 결과 <strong id="srCount" style="color:#00B0FF;">0</strong>건</span>
                <button onclick="clearSearch()" style="font-size:11px;color:var(--text-sub);background:none;border:none;cursor:pointer;">초기화</button>
            </div>
            <!-- 결과 리스트 -->
            <div id="srList" class="no-scrollbar" style="overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px;max-height:340px;">
                <div style="font-size:12px;color:var(--text-sub);text-align:center;padding:20px 0;">검색어를 입력하세요</div>
            </div>
        </div>
    </div>

    <!-- ── 제품 상세스펙 모달 ─────────────────────────────── -->
    <div id="specModal" style="position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);">
        <div style="background:var(--panel);border:1px solid var(--border);border-radius:24px 24px 0 0;padding:20px;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
                <span style="font-size:16px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px;">
                    <i class="fa-solid fa-ruler-combined" style="color:#00E676;"></i> 제품 상세 스펙 조회
                </span>
                <button onclick="closeModal('specModal')" style="width:34px;height:34px;border-radius:10px;border:none;background:var(--icon-bg);color:var(--text-sub);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <input id="spec_code" type="text" placeholder="제품코드 입력 (예: CAC2083SN)"
                style="background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14px;outline:none;width:100%;"
                oninput="runSpecSearch()" onfocus="this.style.borderColor='#00E676'" onblur="this.style.borderColor='var(--border)'">
            <div id="specList" class="no-scrollbar" style="overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px;max-height:400px;">
                <div style="font-size:12px;color:var(--text-sub);text-align:center;padding:20px 0;">제품코드를 입력하세요</div>
            </div>
        </div>
    </div>

    <!-- ── 설정 모달 ──────────────────────────────────────── -->
    <div id="settingsModal" style="position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);">
        <div style="background:var(--panel);border:1px solid var(--border);border-radius:24px 24px 0 0;padding:20px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
                <span style="font-size:16px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px;">
                    <i class="fa-solid fa-gear" style="color:#00B0FF;"></i> 설정
                </span>
                <button onclick="closeModal('settingsModal')" style="width:34px;height:34px;border-radius:10px;border:none;background:var(--icon-bg);color:var(--text-sub);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px;">
                <!-- CSV 업로드 -->
                <label style="background:var(--input-bg);border:1px solid var(--border);border-radius:14px;padding:15px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;font-size:14px;font-weight:700;color:var(--text);">
                    <i class="fa-solid fa-file-csv" style="color:#00B0FF;font-size:18px;width:22px;"></i>
                    CSV 파일 업로드
                    <input type="file" id="csvFileInput" accept=".csv" multiple style="display:none;" onchange="handleCsvUpload(event)">
                </label>
                <!-- 연동 설정 -->
                <button onclick="openConnModal()" style="background:var(--input-bg);border:1px solid var(--border);border-radius:14px;padding:15px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;font-size:14px;font-weight:700;color:var(--text);width:100%;text-align:left;">
                    <i class="fa-solid fa-link" style="color:#00E676;font-size:18px;width:22px;"></i>
                    연동 설정
                </button>
                <!-- 연동 초기화 -->
                <button onclick="resetConn()" style="background:rgba(255,23,68,.06);border:1px solid rgba(255,23,68,.2);border-radius:14px;padding:15px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;font-size:14px;font-weight:700;color:#FF1744;width:100%;text-align:left;">
                    <i class="fa-solid fa-power-off" style="font-size:18px;width:22px;"></i>
                    연동 초기화
                </button>
                <!-- 강화포장 데이터시트 -->
                <a href="https://docs.google.com/spreadsheets/d/1Utm_IuDQkguqvX8-zhfVtfMMQVb_n7SOJ3A7_fVPx54/edit?gid=1357513790#gid=1357513790"
                   target="_blank"
                   style="background:var(--input-bg);border:1px solid var(--border);border-radius:14px;padding:15px 18px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;color:var(--text);text-decoration:none;">
                    <i class="fa-solid fa-file-excel" style="color:#22C55E;font-size:18px;width:22px;"></i>
                    강화포장 데이터시트 바로가기
                    <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:11px;color:var(--text-sub);margin-left:auto;"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- 연동 설정 서브모달 -->
    <div id="connModal" style="position:fixed;inset:0;z-index:55;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);">
        <div style="background:var(--panel);border:1px solid var(--border);border-radius:24px 24px 0 0;padding:20px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
                <span style="font-size:15px;font-weight:800;color:var(--text);">연동 설정</span>
                <button onclick="closeModal('connModal')" style="width:34px;height:34px;border-radius:10px;border:none;background:var(--icon-bg);color:var(--text-sub);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div style="font-size:12px;color:var(--text-sub);">Apps Script 배포 URL 또는 Google Sheets CSV URL</div>
            <input id="connUrlInput" type="url" placeholder="https://script.google.com/macros/s/.../exec"
                style="background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:13px;outline:none;width:100%;"
                onfocus="this.style.borderColor='#00B0FF'" onblur="this.style.borderColor='var(--border)'">
            <button onclick="saveConnUrl()" style="width:100%;background:#00B0FF;color:#0B0F19;padding:14px;border-radius:12px;border:none;font-size:14px;font-weight:800;cursor:pointer;">
                저장 및 재연동
            </button>
        </div>
    </div>

    <script>
    const GAS_URL = localStorage.getItem('sheet_pub_url') ||
        'https://script.google.com/macros/s/AKfycbzsmA9Cu7xJ5D3DeouBsWKt_ii0YM4U6GPnbWX_NhZughWWh93dTLE4_VNMuBElXqA/exec';

    let allData = [], stockData = [], chartInst = null;

    // ── 테마 ─────────────────────────────────────────────
    function applyTheme(dark) {
        document.documentElement.classList.toggle('dark', dark);
        document.getElementById('themeCheck').checked = dark;
        localStorage.setItem('shell_theme', dark ? 'dark' : 'light');
        if (chartInst) renderChart();
    }
    function toggleTheme() {
        applyTheme(document.getElementById('themeCheck').checked);
    }

    // ── 날짜 유틸 ─────────────────────────────────────────
    function todayStr() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }
    function fmtKr(s) {
        if (!s || s === '-') return '—';
        const d = new Date(s);
        if (isNaN(d)) return s;
        return (d.getMonth()+1) + '.' + d.getDate() + ' (' + ['일','월','화','수','목','금','토'][d.getDay()] + ')';
    }

    // ── 데이터 로드 ───────────────────────────────────────
    async function loadData() {
        setStatus('loading');
        const icon = document.getElementById('syncIcon');
        icon.classList.add('spin');
        try {
            const res  = await fetch(GAS_URL, { signal: AbortSignal.timeout(15000) });
            const json = JSON.parse(await res.text());
            allData = []; stockData = [];
            for (const sheet in json) {
                const rows = json[sheet];
                if (sheet.includes('충주공장 재고')) {
                    stockData = mapRows(rows);
                    allData   = allData.concat(stockData);
                } else if (sheet.includes('수출 표준품 현황')) {
                    allData = allData.concat(mapRows(rows));
                } else if (sheet.includes('출고 완료')) {
                    allData = allData.concat(mapRows(rows));
                }
            }
            renderAll();
            setStatus('ok');
        } catch(e) {
            setStatus('error');
        } finally {
            icon.classList.remove('spin');
        }
    }

    function mapRows(rows) {
        if (!rows || rows.length < 2) return [];
        const hdr = rows[0].map(h => (h||'').toString().trim().replace(/\s+/g,'').toLowerCase());
        const fi  = (...aliases) => {
            for (const a of aliases) {
                const i = hdr.findIndex(h => h === a.toLowerCase() || h.includes(a.toLowerCase()));
                if (i !== -1) return i;
            }
            return -1;
        };
        const iDate   = fi('상차일','date');
        const iReg    = fi('포장일','등록일자','regdate');
        const iRound  = fi('수주건명','건명','차수','round');
        const iQty    = fi('수량','qty');
        const iDue    = fi('전산상납기','전산납기','납기','duedate');
        const iStatus = fi('진행','진행상태','상태','status');
        const iCode   = fi('품목코드','제품코드','code');
        const iCtry   = fi('제품구분','제품 구분','country');
        const iSpecW  = fi('가로','W','폭','WIDTH','specw');
        const iSpecD  = fi('세로','D','깊이','DEPTH','specd');
        const iSpecH  = fi('높이','H','HEIGHT','spech');
        const iSpecG  = fi('무게','중량','G','KG','specg');

        const result = [];
        for (let i = 1; i < rows.length; i++) {
            const r = rows[i];
            if (!r || r.every(c => !c || !c.toString().trim())) continue;
            const code   = r[iCode]   ? r[iCode].toString().trim()   : '';
            const qty    = parseInt((r[iQty]||'').toString().replace(/[^0-9]/g,'')) || 0;
            if (!code && qty === 0) continue;
            const status = r[iStatus] ? r[iStatus].toString().trim() : '미입고';
            const date   = r[iDate]   ? r[iDate].toString().trim()   : '-';
            const regDate= r[iReg]    ? r[iReg].toString().trim()    : date;
            const round  = r[iRound]  ? r[iRound].toString().trim()  : '-';
            const dueDate= r[iDue]    ? r[iDue].toString().trim()    : '-';
            const country= r[iCtry]   ? r[iCtry].toString().trim()   : 'FAM';
            const sn     = status.replace(/\s+/g,'').toLowerCase();
            const isDone = sn.includes('출고') || sn.includes('포장완료') || sn.includes('피킹');
            const specW  = iSpecW >= 0 && r[iSpecW] ? r[iSpecW].toString().trim() : '';
            const specD  = iSpecD >= 0 && r[iSpecD] ? r[iSpecD].toString().trim() : '';
            const specH  = iSpecH >= 0 && r[iSpecH] ? r[iSpecH].toString().trim() : '';
            const specG  = iSpecG >= 0 && r[iSpecG] ? r[iSpecG].toString().trim() : '';
            result.push({ code, qty, status, date, regDate, round, dueDate, country, isDone, specW, specD, specH, specG });
        }
        return result;
    }

    // ── 렌더링 ────────────────────────────────────────────
    function renderAll() { renderKPIs(); renderSchedule(); renderWorkLog(); renderChart(); }

    function renderKPIs() {
        const pending = stockData.filter(d => {
            const s = d.status.replace(/\s+/g,'').toLowerCase();
            return s.includes('포장대기') || s.includes('미확인') || s.includes('미입고') || s.includes('입고');
        });
        document.getElementById('kpiPendingQty').textContent   = pending.reduce((s,d)=>s+d.qty,0).toLocaleString() || '0';
        document.getElementById('kpiPendingItems').textContent = pending.length;
        document.getElementById('kpiTodayDate').textContent    = fmtKr(todayStr());
        const w = localStorage.getItem('todayWorkers_'+todayStr()) || localStorage.getItem('todayWorkers') || '0';
        document.getElementById('kpiWorkers').textContent = w;
    }

    function renderSchedule() {
        const today = new Date(); today.setHours(0,0,0,0);
        const candidates = allData.filter(d => d.date && d.date !== '-' && !d.isDone);
        let nearest = null, minDiff = Infinity;
        candidates.forEach(d => {
            const dt = new Date(d.date);
            if (isNaN(dt)) return;
            const diff = dt - today;
            if (diff >= 0 && diff < minDiff) { minDiff = diff; nearest = d; }
        });
        if (nearest) {
            const days = Math.ceil(minDiff / 86400000);
            document.getElementById('nearestDDay').textContent     = days === 0 ? 'D-Day' : 'D-' + days;
            document.getElementById('nearestRound').textContent    = nearest.round;
            document.getElementById('nearestLoadDate').textContent = fmtKr(nearest.date);
            document.getElementById('nearestQtyVal').textContent   = nearest.qty.toLocaleString();
        } else {
            document.getElementById('nearestDDay').textContent     = '—';
            document.getElementById('nearestRound').textContent    = '예정 일정 없음';
            document.getElementById('nearestLoadDate').textContent = '';
            document.getElementById('nearestQtyVal').textContent   = '—';
        }
    }

    function renderWorkLog() {
        const list = document.getElementById('workLogList');
        const done = allData.filter(d => d.isDone).sort((a,b) => b.regDate > a.regDate ? 1 : -1);
        if (!done.length) {
            list.innerHTML = '<div style="font-size:12px;color:var(--text-sub);text-align:center;padding:16px 0;">완료된 작업이 없습니다</div>';
            return;
        }
        list.innerHTML = done.slice(0,12).map((d,i,arr) => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;${i<arr.length-1?'border-bottom:1px solid var(--log-border);':''}">
                <div style="min-width:0;flex:1;">
                    <div style="font-size:12px;font-weight:700;color:var(--text);font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${d.code}</div>
                    <div style="font-size:10px;color:var(--text-sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${d.round}</div>
                </div>
                <div style="text-align:right;flex-shrink:0;margin-left:12px;">
                    <div style="font-size:12px;font-weight:700;color:#00B0FF;font-family:monospace;">${d.qty.toLocaleString()} ea</div>
                    <div style="font-size:10px;color:var(--text-sub);font-family:monospace;margin-top:2px;">${d.regDate}</div>
                </div>
            </div>
        `).join('');
    }

    function renderChart() {
        if (typeof Chart === 'undefined') return;
        const isDark  = document.documentElement.classList.contains('dark');
        const textClr = isDark ? '#64748B' : '#94A3B8';
        const gridClr = isDark ? '#1E293B' : '#E2E8F0';
        const cMap = {};
        allData.forEach(d => {
            if (!d.country || d.country === '-') return;
            if (!cMap[d.country]) cMap[d.country] = { pending: 0, done: 0 };
            if (d.isDone) cMap[d.country].done    += d.qty;
            else          cMap[d.country].pending += d.qty;
        });
        const labels = Object.keys(cMap).filter(Boolean).sort();
        if (!labels.length) return;
        if (chartInst) { chartInst.destroy(); chartInst = null; }
        chartInst = new Chart(document.getElementById('mainChart').getContext('2d'), {
            type: 'bar',
            data: {
                labels,
                datasets: [
                    { label: '포장대기', data: labels.map(c=>cMap[c].pending), backgroundColor:'rgba(255,145,0,.75)', borderRadius:5 },
                    { label: '완료',     data: labels.map(c=>cMap[c].done),    backgroundColor:'rgba(0,176,255,.6)',  borderRadius:5 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { labels: { color: textClr, font:{size:11} } } },
                scales: {
                    y: { ticks:{color:textClr}, grid:{color:gridClr} },
                    x: { ticks:{color:textClr}, grid:{display:false} }
                }
            }
        });
    }

    // ── 모달 헬퍼 ─────────────────────────────────────────
    function openModal(id) {
        const el = document.getElementById(id);
        if (el) el.style.display = 'flex';
    }
    function closeModal(id) {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
    }

    // ── 제품검색 서브메뉴 ──────────────────────────────────
    function toggleSearchSub() {
        const menu = document.getElementById('searchSubMenu');
        const bd   = document.getElementById('searchSubBd');
        if (menu.style.display !== 'none') {
            closeSearchSub();
        } else {
            menu.style.display = 'flex';
            bd.style.display   = 'block';
            requestAnimationFrame(() => {
                menu.style.opacity   = '1';
                menu.style.transform = 'translateX(-50%) translateY(0)';
            });
            navSelect('navSearch');
        }
    }
    function closeSearchSub() {
        const menu = document.getElementById('searchSubMenu');
        const bd   = document.getElementById('searchSubBd');
        menu.style.opacity   = '0';
        menu.style.transform = 'translateX(-50%) translateY(12px)';
        setTimeout(() => { menu.style.display = 'none'; bd.style.display = 'none'; }, 200);
    }

    // ── 하단 탭 선택 ──────────────────────────────────────
    function navSelect(activeId) {
        ['navHome','navChart','navSearch','navSettings'].forEach(id => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.style.color = id === activeId ? '#00B0FF' : 'var(--text-sub)';
        });
    }

    // ── 수출/제품 상세검색 ─────────────────────────────────
    function runSearch() {
        const round   = (document.getElementById('sf_round').value   || '').trim().toLowerCase();
        const code    = (document.getElementById('sf_code').value    || '').trim().toLowerCase();
        const country = (document.getElementById('sf_country').value || '').trim().toLowerCase();
        if (!round && !code && !country) {
            document.getElementById('srCount').textContent = '0';
            document.getElementById('srList').innerHTML = '<div style="font-size:12px;color:var(--text-sub);text-align:center;padding:20px 0;">검색어를 입력하세요</div>';
            return;
        }
        const filtered = allData.filter(d => {
            if (round   && !(d.round   ||'').toLowerCase().includes(round))   return false;
            if (code    && !(d.code    ||'').toLowerCase().includes(code))    return false;
            if (country && !(d.country ||'').toLowerCase().includes(country)) return false;
            return true;
        });
        document.getElementById('srCount').textContent = filtered.length;
        if (!filtered.length) {
            document.getElementById('srList').innerHTML = '<div style="font-size:12px;color:var(--text-sub);text-align:center;padding:20px 0;">결과 없음</div>';
            return;
        }
        document.getElementById('srList').innerHTML = filtered.slice(0,50).map(d => {
            const sc = d.isDone ? '#00E676' : (d.status.includes('포장대기') ? '#FF9100' : '#64748B');
            return `<div style="background:var(--input-bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;">
                <div style="display:flex;align-items:center;justify-content:space-between;">
                    <span style="font-size:13px;font-weight:800;font-family:monospace;color:var(--text);">${d.code||'-'}</span>
                    <span style="font-size:11px;font-weight:700;color:${sc};background:${sc}22;padding:2px 8px;border-radius:20px;">${d.status}</span>
                </div>
                <div style="font-size:11px;color:var(--text-sub);display:flex;gap:12px;align-items:center;">
                    <span>${d.country}</span><span>${d.round}</span>
                    <span style="margin-left:auto;font-weight:700;color:var(--text);">${d.qty.toLocaleString()} BOX</span>
                </div>
                <div style="font-size:10px;font-family:monospace;color:var(--label);">상차 ${d.date} · 납기 ${d.dueDate}</div>
            </div>`;
        }).join('');
    }
    function clearSearch() {
        ['sf_round','sf_code','sf_country'].forEach(id => { document.getElementById(id).value = ''; });
        runSearch();
    }

    // ── 제품 상세스펙 조회 ─────────────────────────────────
    const _stripUnit = val => (!val || val==='-') ? '' : val.toString().trim().replace(/[a-zA-Z가-힣]+$/g,'').trim();
    const _fmt       = n   => n % 1 === 0 ? n.toFixed(0) : n.toFixed(1);

    function _specStats(items, field) {
        const vals = items.map(i => parseFloat(_stripUnit(i[field]))).filter(v => !isNaN(v) && v > 0);
        if (!vals.length) return { avg:'—', tol:null, count:0 };
        const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
        const tol = (Math.max(...vals) - Math.min(...vals)) / 2;
        return { avg:_fmt(avg), tol:_fmt(tol), count:vals.length };
    }
    function _renderTol(tol, count) {
        if (tol === null) return '';
        if (count <= 1) return '<span style="color:#F59E0B;font-size:10px;">데이터 부족</span>';
        if (parseFloat(tol) === 0) return '<span style="color:#64748B;font-size:10px;">±0 균일</span>';
        return '<span style="color:#94A3B8;font-size:10px;">±'+tol+'</span>';
    }

    function runSpecSearch() {
        const code = (document.getElementById('spec_code').value || '').trim().toLowerCase();
        const list  = document.getElementById('specList');
        if (!code) {
            list.innerHTML = '<div style="font-size:12px;color:var(--text-sub);text-align:center;padding:20px 0;">제품코드를 입력하세요</div>';
            return;
        }
        const matches = allData.filter(d => (d.code||'').toLowerCase().includes(code));
        if (!matches.length) {
            list.innerHTML = '<div style="font-size:12px;color:var(--text-sub);text-align:center;padding:20px 0;">결과 없음</div>';
            return;
        }

        // 코드별 그룹핑
        const groups = {};
        matches.forEach(d => {
            const k = d.code; if (!groups[k]) groups[k] = []; groups[k].push(d);
        });

        list.innerHTML = Object.entries(groups).slice(0,5).map(([, items]) => {
            const dc  = items[0].code;
            const wS  = _specStats(items,'specW');
            const dS  = _specStats(items,'specD');
            const hS  = _specStats(items,'specH');
            const gS  = _specStats(items,'specG');

            // CBM
            const cbmVals = items.map(i => {
                const w=parseFloat(_stripUnit(i.specW)), d=parseFloat(_stripUnit(i.specD)), h=parseFloat(_stripUnit(i.specH));
                return (isNaN(w)||isNaN(d)||isNaN(h)||w<=0||d<=0||h<=0) ? NaN : (w*d*h)/1e9;
            }).filter(v=>!isNaN(v));
            let cbmAvg='—', cbmTol=null, cbmCnt=0;
            if (cbmVals.length) {
                const avg=cbmVals.reduce((a,b)=>a+b,0)/cbmVals.length;
                cbmAvg=avg.toFixed(4); cbmTol=((Math.max(...cbmVals)-Math.min(...cbmVals))/2).toFixed(4); cbmCnt=cbmVals.length;
            }

            const sampleN = Math.max(wS.count,dS.count,hS.count,gS.count,cbmCnt);

            // 이력
            const history = [...items].sort((a,b)=>b.regDate>a.regDate?1:-1).slice(0,10).map(d => {
                const sc = d.isDone ? '#00E676' : (d.status.includes('포장대기')?'#FF9100':'#64748B');
                return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--log-border);">
                    <div style="min-width:0;flex:1;">
                        <div style="font-size:11px;font-weight:700;color:var(--text);font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${d.round}</div>
                        <div style="font-size:10px;color:var(--text-sub);margin-top:2px;">${d.regDate}</div>
                    </div>
                    <div style="flex-shrink:0;margin-left:10px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;">
                        <span style="font-size:10px;font-weight:700;color:${sc};background:${sc}22;padding:1px 7px;border-radius:20px;">${d.status}</span>
                        <span style="font-size:10px;color:var(--text-sub);font-family:monospace;">${d.qty.toLocaleString()} BOX</span>
                    </div>
                </div>`;
            }).join('');

            return `<div style="background:var(--input-bg);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;">
                <div style="display:flex;align-items:center;justify-content:space-between;">
                    <span style="font-size:13px;font-weight:800;font-family:monospace;color:var(--text);">${dc}</span>
                    ${sampleN>0?'<span style="font-size:10px;color:var(--label);font-family:monospace;">n='+sampleN+'</span>':''}
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                    ${specCell('가로 (W)',wS.avg,'mm',_renderTol(wS.tol,wS.count))}
                    ${specCell('세로 (D)',dS.avg,'mm',_renderTol(dS.tol,dS.count))}
                    ${specCell('높이 (H)',hS.avg,'mm',_renderTol(hS.tol,hS.count))}
                    ${specCell('무게 (G)',gS.avg,'kg',_renderTol(gS.tol,gS.count))}
                    <div style="grid-column:span 2;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;">
                        <div style="font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--label);text-transform:uppercase;">CBM (m³)</div>
                        <div style="display:flex;align-items:baseline;gap:6px;margin-top:4px;">
                            <span style="font-size:18px;font-weight:800;color:#00B0FF;font-family:monospace;">${cbmAvg}</span>
                            ${cbmAvg!=='—'?'<span style="font-size:10px;color:var(--text-sub);">m³</span>':''}
                            <span style="margin-left:4px;">${_renderTol(cbmTol,cbmCnt)}</span>
                        </div>
                    </div>
                </div>
                <div>
                    <div style="font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--label);text-transform:uppercase;margin-bottom:6px;">수출 진행 이력</div>
                    ${history || '<div style="font-size:11px;color:var(--text-sub);padding:8px 0;">이력 없음</div>'}
                </div>
            </div>`;
        }).join('');
    }
    function specCell(label, val, unit, tolHtml) {
        return `<div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;">
            <div style="font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--label);text-transform:uppercase;">${label}</div>
            <div style="font-size:16px;font-weight:800;color:var(--text);margin-top:4px;font-family:monospace;">${val}<span style="font-size:10px;font-weight:400;color:var(--text-sub);margin-left:3px;">${val!=='—'?unit:''}</span></div>
            <div style="margin-top:3px;min-height:14px;">${tolHtml||''}</div>
        </div>`;
    }

    // ── 연동 설정 ─────────────────────────────────────────
    function openConnModal() {
        document.getElementById('connUrlInput').value = localStorage.getItem('sheet_pub_url') || GAS_URL;
        openModal('connModal');
    }
    function saveConnUrl() {
        const url = document.getElementById('connUrlInput').value.trim();
        if (!url) return;
        localStorage.setItem('sheet_pub_url', url);
        closeModal('connModal');
        closeModal('settingsModal');
        loadData();
    }
    function resetConn() {
        if (!confirm('연동 설정을 초기화하고 기본 URL로 되돌릴까요?')) return;
        localStorage.removeItem('sheet_pub_url');
        closeModal('settingsModal');
        location.reload();
    }

    // ── CSV 업로드 ────────────────────────────────────────
    function handleCsvUpload(event) {
        const files = Array.from(event.target.files || []);
        if (!files.length) return;
        let done = 0;
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const rows = e.target.result.split(/\r?\n/).map(r => r.split(',').map(c => c.trim().replace(/^"|"$/g,'')));
                    allData = allData.concat(mapRows(rows));
                } catch(err) { console.error(err); }
                if (++done === files.length) { renderAll(); alert(files.length + '개 파일 로드 완료'); }
            };
            reader.readAsText(file, 'UTF-8');
        });
        event.target.value = '';
    }

    // ── 작업 인원 모달 ────────────────────────────────────
    function openWorkerInput() {
        const cur = localStorage.getItem('todayWorkers_'+todayStr()) || localStorage.getItem('todayWorkers') || '';
        document.getElementById('workerInput').value = cur;
        const m = document.getElementById('workerModal');
        m.style.display = 'flex';
        setTimeout(() => document.getElementById('workerInput').focus(), 150);
    }
    function closeWorkerInput() { document.getElementById('workerModal').style.display = 'none'; }
    function saveWorkers() {
        const v = parseInt(document.getElementById('workerInput').value) || 0;
        localStorage.setItem('todayWorkers_'+todayStr(), v);
        localStorage.setItem('todayWorkers', v);
        document.getElementById('kpiWorkers').textContent = v;
        closeWorkerInput();
    }

    // ── 상태 표시 ─────────────────────────────────────────
    function setStatus(s) {
        const bar = document.getElementById('statusBar');
        const btn = `<button onclick="loadData()" style="margin-left:auto;background:none;border:none;cursor:pointer;color:var(--text-sub);font-size:13px;padding:4px;"><i id="syncIcon" class="fa-solid fa-arrows-rotate"></i></button>`;
        if (s==='loading') {
            bar.innerHTML = `<i class="fa-solid fa-circle-notch spin" style="color:#00B0FF;font-size:10px;"></i><span style="color:var(--text-sub);font-size:11px;font-family:monospace;">데이터 로딩 중...</span>${btn}`;
        } else if (s==='ok') {
            const t = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
            bar.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#00E676;font-size:10px;"></i><span style="color:var(--text-sub);font-size:11px;font-family:monospace;">업데이트 완료 · ${t}</span>${btn}`;
        } else {
            bar.innerHTML = `<i class="fa-solid fa-circle-exclamation" style="color:#FF9100;font-size:10px;"></i><span style="color:var(--text-sub);font-size:11px;font-family:monospace;">오프라인 모드</span>${btn}`;
        }
    }

    // ── 초기 실행 ─────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
        // 테마: 저장값 없으면 라이트 모드
        const saved = localStorage.getItem('shell_theme') || 'light';
        applyTheme(saved === 'dark');

        document.getElementById('kpiTodayDate').textContent = fmtKr(todayStr());
        const w = localStorage.getItem('todayWorkers_'+todayStr()) || localStorage.getItem('todayWorkers') || '0';
        document.getElementById('kpiWorkers').textContent = w;
        loadData();
    });
    </script>
</body>
</html>

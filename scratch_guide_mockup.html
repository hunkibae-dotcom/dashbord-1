<meta name="claude:viewport-fit-sides" content="cover">
<title>대시보드 사용 설명서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<style>
  /* 레이아웃: 설정창 안에 들어갈 전체화면 가이드 뷰 — 상단 고정 헤더(앱 전환 + 검색),
     그 아래 카테고리 칩, 본문은 기능 카드의 아코디언 목록. 앱마다 고유 억센트 컬러로
     "지금 어떤 대시보드의 설명서인지" 바로 구분되게 한다. */
  :root {
    --bg: #F4F5F7;
    --panel: #FFFFFF;
    --ink: #16181D;
    --ink-sub: #6B7280;
    --label: #9CA3AF;
    --border: #E5E7EB;
    --divider: #EEF0F3;
    --qc: #6D5CE8;
    --qc-soft: #F0EEFE;
    --pkg: #0062FF;
    --pkg-soft: #EAF1FF;
    --accent: var(--qc);
    --accent-soft: var(--qc-soft);
    --good: #16A34A;
    --good-soft: #EAFBF1;
    --warn: #D97706;
    --warn-soft: #FEF6E7;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E0F13; --panel: #17191F; --ink: #F2F3F5; --ink-sub: #9BA1AC; --label: #6B7280;
      --border: #272A32; --divider: #1D2027; --qc-soft: rgba(109,92,232,.16); --pkg-soft: rgba(0,98,255,.16);
      --good-soft: rgba(22,163,74,.16); --warn-soft: rgba(217,119,6,.18); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E0F13; --panel: #17191F; --ink: #F2F3F5; --ink-sub: #9BA1AC; --label: #6B7280;
    --border: #272A32; --divider: #1D2027; --qc-soft: rgba(109,92,232,.16); --pkg-soft: rgba(0,98,255,.16);
    --good-soft: rgba(22,163,74,.16); --warn-soft: rgba(217,119,6,.18); color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    padding-left: max(0px, env(safe-area-inset-left, 0px));
    padding-right: max(0px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column;
  }
  h1, h2, h3, .disp { font-family: 'Manrope', sans-serif; text-wrap: balance; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* ── 안내 배너(시안임을 알림) ── */
  .draft-banner { background: var(--warn-soft); color: var(--warn); font-size: 12.5px; font-weight: 600; text-align: center; padding: 9px 16px; line-height: 1.5; }
  .draft-banner b { font-weight: 800; }

  /* ── 가짜 "설정 화면" 맥락 바 — 실제로 이 설명서가 어디서 열리는지 보여줌 ── */
  .context-bar { display: flex; align-items: center; gap: 8px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--label); font-weight: 600; }
  .context-bar i { font-size: 10px; }
  .context-bar b { color: var(--ink-sub); }

  /* ── 상단 고정 헤더 ── */
  .guide-head { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--border); padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 14px; }
  .title-row { display: flex; align-items: center; gap: 12px; }
  .title-row .ic { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; background: linear-gradient(135deg, var(--accent), var(--accent)); transition: background .2s; }
  .title-row h1 { font-size: 17px; font-weight: 800; margin: 0; }
  .title-row .sub { font-size: 11.5px; color: var(--label); margin-top: 1px; font-weight: 600; }

  .app-switch { display: flex; gap: 6px; background: var(--divider); border-radius: 11px; padding: 4px; }
  .app-switch button { flex: 1; border: none; background: transparent; padding: 9px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 700; color: var(--ink-sub); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .app-switch button.on { background: var(--panel); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .app-switch button .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .platform-row { display: flex; align-items: center; gap: 8px; }
  .platform-row .seg { display: flex; gap: 3px; background: var(--divider); border-radius: 9px; padding: 3px; }
  .platform-row .seg button { border: none; background: transparent; padding: 6px 12px; border-radius: 6px; font-size: 11.5px; font-weight: 700; color: var(--ink-sub); cursor: pointer; }
  .platform-row .seg button.on { background: var(--accent); color: #fff; }
  .search-wrap { position: relative; flex: 1; min-width: 0; }
  .search-wrap i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--label); font-size: 12px; }
  .search-wrap input { width: 100%; box-sizing: border-box; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px 8px 30px; font-size: 12.5px; color: var(--ink); outline: none; font-family: inherit; }
  .search-wrap input:focus { border-color: var(--accent); }

  /* ── 카테고리 칩 ── */
  .cat-row { display: flex; gap: 7px; overflow-x: auto; padding: 12px 18px 4px; }
  .cat-row::-webkit-scrollbar { display: none; }
  .cat-chip { flex-shrink: 0; padding: 7px 13px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--panel); color: var(--ink-sub); font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .cat-chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .cat-chip .n { font-size: 10px; opacity: .75; }

  /* ── 본문 ── */
  main { flex: 1; overflow-y: auto; padding: 10px 18px max(28px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
  .cat-label { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--label); margin: 14px 2px 2px; }
  .cat-label:first-child { margin-top: 2px; }

  .feat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .feat-head { display: flex; align-items: center; gap: 11px; padding: 13px 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .feat-head .ic { width: 32px; height: 32px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13.5px; }
  .feat-head .txt { flex: 1; min-width: 0; }
  .feat-head .name { font-size: 13.5px; font-weight: 700; color: var(--ink); }
  .feat-head .hint { font-size: 11px; color: var(--label); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feat-head .badges { display: flex; gap: 4px; flex-shrink: 0; }
  .plat-badge { font-size: 9px; font-weight: 800; padding: 2.5px 6px; border-radius: 6px; letter-spacing: .02em; }
  .plat-badge.web { background: var(--good-soft); color: var(--good); }
  .plat-badge.app { background: var(--warn-soft); color: var(--warn); }
  .plat-badge.both { background: var(--divider); color: var(--ink-sub); }
  .chev { color: var(--label); font-size: 11px; transition: transform .15s; flex-shrink: 0; }
  .feat-card.open .chev { transform: rotate(180deg); }

  .feat-body { display: none; padding: 0 14px 15px 57px; }
  .feat-card.open .feat-body { display: block; }
  .feat-sec { margin-bottom: 11px; }
  .feat-sec:last-child { margin-bottom: 0; }
  .feat-sec-label { font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
  .feat-sec p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-sub); }
  .steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .steps li { display: flex; gap: 8px; font-size: 12.5px; line-height: 1.5; color: var(--ink); }
  .steps li .num { flex-shrink: 0; width: 17px; height: 17px; border-radius: 50%; background: var(--divider); color: var(--ink-sub); font-size: 9.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .steps li b { color: var(--accent); font-weight: 700; }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--label); }
  .empty-state i { font-size: 26px; margin-bottom: 10px; display: block; }
  .empty-state p { margin: 0; font-size: 12.5px; }

  @media (min-width: 640px) {
    main { max-width: 640px; margin: 0 auto; width: 100%; }
    .guide-head, .cat-row { max-width: 640px; margin: 0 auto; width: 100%; }
  }
</style>

<div class="draft-banner"><b>디자인 시안</b>입니다 — 실제 기능은 연결되어 있지 않고, 각 대시보드 설정창 안에 이런 모습으로 들어갈 예정입니다. 품질검사/포장강화 전환, 웹·앱 필터, 카테고리, 검색까지 직접 눌러보실 수 있습니다.</div>

<div class="context-bar"><i class="fa-solid fa-gear"></i> 설정 &nbsp;›&nbsp; <b>사용 설명서</b></div>

<div class="guide-head">
  <div class="title-row">
    <div class="ic" id="headIcon"><i class="fa-solid fa-book-open"></i></div>
    <div>
      <h1 id="headTitle">품질검사 사용 설명서</h1>
      <div class="sub" id="headSub">14개 기능 · 웹 10 · 앱 11</div>
    </div>
  </div>

  <div class="app-switch">
    <button class="on" id="appBtnQc" onclick="setApp('qc')"><span class="dot"></span>품질검사</button>
    <button id="appBtnPkg" onclick="setApp('pkg')"><span class="dot"></span>포장강화</button>
  </div>

  <div class="platform-row">
    <div class="seg">
      <button class="on" id="platBtnAll" onclick="setPlatform('all')">전체</button>
      <button id="platBtnWeb" onclick="setPlatform('web')">웹</button>
      <button id="platBtnApp" onclick="setPlatform('app')">앱</button>
    </div>
    <div class="search-wrap">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="searchInput" type="text" placeholder="기능 이름으로 찾기" oninput="render()">
    </div>
  </div>
</div>

<div class="cat-row" id="catRow"></div>

<main id="main"></main>

<script>
  // ── 데이터: 실제 두 대시보드에 지금 들어있는 기능 중 대표적인 것들로 구성한 샘플.
  // 실제 반영 단계에서는 전체 기능을 이 형태로 다 채운다.
  const DATA = {
    qc: {
      label: '품질검사', icon: 'fa-solid fa-clipboard-check',
      categories: ['현황·진행', '검색·조회', '신규 품목', '보고서', '데이터 출력'],
      features: [
        { cat: '현황·진행', icon: 'fa-solid fa-gauge-high', name: '진행상태 변경', plat: 'both',
          when: '검사를 마쳤거나 포장대기·재투입 등 상태가 바뀌었을 때 사용합니다.',
          steps: ['품목 카드 또는 표에서 상태 배지를 누릅니다.', '바뀐 상태를 고르면 바로 시트에 반영됩니다.', '검사 완료로 바꾸면 검사일이 오늘 날짜로 자동 기록됩니다.'] },
        { cat: '검색·조회', icon: 'fa-solid fa-magnifying-glass', name: '제품검색', plat: 'both',
          when: '단품코드나 건명으로 특정 품목을 바로 찾고 싶을 때 사용합니다.',
          steps: ['하단(앱) 또는 사이드바(웹)의 "검사" › "제품검색"을 엽니다.', '단품코드, 건명, 날짜, 공장 중 아는 조건을 입력합니다.', '결과 목록에서 품목을 눌러 바로 수정할 수 있습니다.'] },
        { cat: '검색·조회', icon: 'fa-solid fa-ruler-combined', name: '상세스펙 조회', plat: 'both',
          when: '같은 단품코드의 과거 규격(가로·세로·높이·CBM) 평균을 확인하고 싶을 때 사용합니다.',
          steps: ['상세스펙 메뉴를 엽니다.', '단품코드를 입력하면 지금까지의 평균 규격과 이력이 뜹니다.'] },
        { cat: '신규 품목', icon: 'fa-solid fa-star', name: '신규품목 확인', plat: 'both',
          when: '수주 파일에 새로 추가된 품목을 확인하고, 반영 완료 표시를 해야 할 때 사용합니다.',
          steps: ['홈 화면의 "신규품목" 카드를 누릅니다.', '목록에서 확인한 품목을 체크합니다.', '"확인"을 누르면 신규 표시가 지워집니다.'] },
        { cat: '신규 품목', icon: 'fa-solid fa-plus', name: '신규품목 수기등록', plat: 'web',
          when: '수주 파일 업데이트 없이, 급하게 품목을 직접 입력해 등록해야 할 때 사용합니다.',
          steps: ['신규품목 확인창 왼쪽의 "+ 신규등록"을 누릅니다.', '건명·공장·납기일을 입력합니다.', '품목 줄마다 단품코드를 입력하면 이력이 있으면 단품명칭이 자동으로 채워집니다.', '"신규 등록"을 누르면 실제 시트에 바로 들어갑니다.'] },
        { cat: '보고서', icon: 'fa-solid fa-file-powerpoint', name: '수출건 검사 세부내역 보고서', plat: 'web',
          when: '고객사에 전달할 검사 결과 보고서(PPTX)를 만들어야 할 때 사용합니다.',
          steps: ['보고서 메뉴에서 대상 건을 선택합니다.', 'CBM·특이사항·사진을 입력합니다.', '"보고서 생성"을 누르면 PPTX 파일로 내려받습니다.'] },
        { cat: '데이터 출력', icon: 'fa-solid fa-file-export', name: '데이터 출력(PDF)', plat: 'web',
          when: '현재 조회된 목록을 인쇄물로 뽑아 현장에 붙이거나 공유해야 할 때 사용합니다.',
          steps: ['조회 결과 화면에서 "데이터 출력"을 누릅니다.', '세로·가로 중 용지 방향을 고릅니다.', 'PDF가 자동으로 페이지를 나눠 생성됩니다.'] },

    },

      categories: ['현황·진행', '검색·조회', '신규 품목', '불량조치', '데이터 출력'],

          when: '건명·단품코드·색상·적재번호 등으로 품목을 좁혀서 찾고 싶을 때 사용합니다.',
          steps: ['하단 "제품검색" › "수출/제품 상세검색"을 엽니다.', '소스(수출현황/재고/출고완료)를 고르고 조건을 입력합니다.', '여러 건을 체크해서 한 번에 일괄수정할 수도 있습니다.'] },
        { cat: '신규 품목', icon: 'fa-solid fa-star', name: '신규 추가 품목 확인·삭제', plat: 'web',
          when: '분류(수주)로 새로 들어온 품목을 확인하거나, 잘못 들어온 품목을 지워야 할 때 사용합니다.',
          steps: ['"신규 추가 품목" 카드를 엽니다.', '확인할 품목은 체크 후 "확인"을, 지울 품목은 체크 후 "삭제"를 누릅니다.', '삭제는 실제 시트에서 바로 지워지므로 신중하게 선택합니다.'] },
        { cat: '불량조치', icon: 'fa-solid fa-clipboard-check', name: '포장불량조치', plat: 'both',
          when: '포장 중 불량/하자를 발견해 사진과 함께 기록하고 조치 이력을 남길 때 사용합니다.',
          steps: ['"불량조치" 메뉴를 엽니다.', '품목을 선택하고 불량유형·사진·조치내용을 입력합니다.', '저장하면 품목 수정창에서도 같은 내용을 바로 볼 수 있습니다.'] },

          steps: ['조회 결과에서 "데이터 출력"을 누릅니다.', 'PDF(보기·인쇄용) 또는 엑셀(수정 가능) 중 고릅니다.', 'PDF는 용지 방향도 선택할 수 있습니다.'] },

  let state = { app: 'qc', platform: 'all', cat: null };

  function setApp(app) {
    state.app = app; state.cat = null;
    document.getElementById('appBtnQc').classList.toggle('on', app === 'qc');
    document.getElementById('appBtnPkg').classList.toggle('on', app === 'pkg');
    document.documentElement.style.setProperty('--accent', app === 'qc' ? 'var(--qc)' : 'var(--pkg)');
    document.documentElement.style.setProperty('--accent-soft', app === 'qc' ? 'var(--qc-soft)' : 'var(--pkg-soft)');
    const d = DATA[app];
    document.getElementById('headIcon').innerHTML = '<i class="' + d.icon + '"></i>';
    document.getElementById('headTitle').textContent = d.label + ' 사용 설명서';
    renderCats();
    render();
  }
  function setPlatform(p) {
    state.platform = p;
    ['all', 'web', 'app'].forEach(k => document.getElementById('platBtn' + k[0].toUpperCase() + k.slice(1)).classList.toggle('on', k === p));
    render();
  }
  function pickCat(c) {
    state.cat = state.cat === c ? null : c;
    renderCats();
    render();
  }
  function renderCats() {
    const d = DATA[state.app];
    const row = document.getElementById('catRow');
    row.innerHTML = d.categories.map(c => {
      const n = d.features.filter(f => f.cat === c).length;
      const on = state.cat === c;
      return `<button class="cat-chip${on ? ' on' : ''}" onclick="pickCat('${c}')">${c} <span class="n">${n}</span></button>`;
    }).join('');
  }
  function matchPlat(f) {
    if (state.platform === 'all') return true;
    return f.plat === 'both' || f.plat === state.platform;
  }
  function platBadges(plat) {
    if (plat === 'both') return '<span class="plat-badge both">웹·앱</span>';
    if (plat === 'web') return '<span class="plat-badge web">웹 전용</span>';
    return '<span class="plat-badge app">앱 전용</span>';
  }
  let openKey = null;
  function toggleCard(key) {
    openKey = openKey === key ? null : key;
    render();
  }
  function render() {
    const d = DATA[state.app];
    const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    let features = d.features.filter(matchPlat);
    if (state.cat) features = features.filter(f => f.cat === state.cat);
    if (q) features = features.filter(f => f.name.toLowerCase().includes(q) || f.when.toLowerCase().includes(q));

    const webCount = d.features.filter(f => f.plat === 'web' || f.plat === 'both').length;
    const appCount = d.features.filter(f => f.plat === 'app' || f.plat === 'both').length;
    document.getElementById('headSub').textContent = d.features.length + '개 기능 · 웹 ' + webCount + ' · 앱 ' + appCount;

    const main = document.getElementById('main');
    if (!features.length) {
      main.innerHTML = '<div class="empty-state"><i class="fa-solid fa-magnifying-glass"></i><p>조건에 맞는 기능이 없습니다</p></div>';
      return;
    }

    // 카테고리 선택 중이 아니면 카테고리별로 묶어서 라벨을 붙인다.
    let html = '';
    let lastCat = null;
    features.forEach((f, i) => {
      if (!state.cat && f.cat !== lastCat) {
        html += `<div class="cat-label">${f.cat}</div>`;
        lastCat = f.cat;
      }
      const key = f.cat + '|' + f.name;
      const open = openKey === key;
      html += `<div class="feat-card${open ? ' open' : ''}">
        <div class="feat-head" onclick="toggleCard('${key.replace(/'/g, "\\'")}')">
          <div class="ic"><i class="${f.icon}"></i></div>
          <div class="txt">
            <div class="name">${f.name}</div>
            <div class="hint">${f.when}</div>
          </div>
          <div class="badges">${platBadges(f.plat)}</div>
          <i class="fa-solid fa-chevron-down chev"></i>
        </div>
        <div class="feat-body">
          <div class="feat-sec">
            <div class="feat-sec-label">언제 사용하나요</div>
            <p>${f.when}</p>
          </div>
          <div class="feat-sec">
            <div class="feat-sec-label">사용 방법</div>
            <ol class="steps">${f.steps.map((s, i) => `<li><span class="num">${i + 1}</span><span>${s}</span></li>`).join('')}</ol>
          </div>
        </div>
      </div>`;
    });
    main.innerHTML = html;
  }

  renderCats();
  render();
</script>
